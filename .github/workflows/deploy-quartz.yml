name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - name: Copy vault notes into Quartz content folder
        run: |
          mkdir -p quartz/content
          rsync -av \
            --exclude='.git' \
            --exclude='.obsidian' \
            --exclude='.github' \
            --exclude='.trash' \
            --exclude='__pycache__' \
            --exclude='.gitignore' \
            vault/ quartz/content/
          if [ ! -f quartz/content/index.md ]; then
            printf -- '---\ntitle: Home\n---\n\nWelcome to my notes. Browse via the explorer on the left, or use search.\n' > quartz/content/index.md
          fi

      - name: Set site title and base URL
        run: |
          cd quartz
          sed -i 's|pageTitle:.*|pageTitle: "Coding Core",|' quartz.config.ts
          sed -i 's|baseUrl:.*|baseUrl: "dwan2333.github.io/my-own-interesting-coding-stuff-",|' quartz.config.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          cd quartz
          npm ci
          npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
